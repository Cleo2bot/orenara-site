kind = "web"
previewPath = "/"
title = "Duskline"
version = "1.0.0"
id = "artifacts/duskline"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25799

[services.development]
run = "pnpm --filter @workspace/duskline run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/duskline", "run", "build" ]
run = "pnpm --filter @workspace/duskline run start"

[services.env]
PORT = "25799"
